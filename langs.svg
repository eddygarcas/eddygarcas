<circle cx="130" cy="130" r="82" fill="none"
      stroke="#244776" stroke-width="40"
      stroke-dasharray="10.671703426803713 504.5494917619223" stroke-dashoffset="-485.80"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="9.451419339437997 505.769775849288" stroke-dashoffset="-497.07"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#41b883" stroke-width="40"
      stroke-dasharray="7.501372265176629 507.7198229235494" stroke-dashoffset="-507.12"/>
  </g>
  <g>
