<circle cx="130" cy="130" r="82" fill="none"
      stroke="#3572A5" stroke-width="40"
      stroke-dasharray="12.711170184718176 502.51002500400784" stroke-dashoffset="-486.80"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#244776" stroke-width="40"
      stroke-dasharray="7.274610627978203 507.94658456074785" stroke-dashoffset="-500.11"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="6.636015043423493 508.58518014530256" stroke-dashoffset="-507.99"/>
  </g>
  <g>
