      stroke="#ec915c" stroke-width="40"
      stroke-dasharray="259.9833411650322 255.23785402369384" stroke-dashoffset="0.00"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#701516" stroke-width="40"
      stroke-dasharray="125.37106202916617 389.85013315955985" stroke-dashoffset="-260.58"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#f1e05a" stroke-width="40"
