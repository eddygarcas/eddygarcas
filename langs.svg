<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="9.25176635079653 505.9694288379295" stroke-dashoffset="-489.01"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#41b883" stroke-width="40"
      stroke-dasharray="7.775297683223206 507.44589750550284" stroke-dashoffset="-498.86"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#b07219" stroke-width="40"
      stroke-dasharray="7.388226968440596 507.8329682202854" stroke-dashoffset="-507.23"/>
  </g>
  <g>
