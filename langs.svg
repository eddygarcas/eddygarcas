      stroke-dasharray="23.557220048473678 491.6639751402524" stroke-dashoffset="-462.79"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#244776" stroke-width="40"
      stroke-dasharray="10.080541894322765 505.14065329440325" stroke-dashoffset="-486.94"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="8.92425745136162 506.29693773736443" stroke-dashoffset="-497.63"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#3572A5" stroke-width="40"
      stroke-dasharray="7.471891952927894 507.74930323579815" stroke-dashoffset="-507.15"/>
  </g>
  <g>
