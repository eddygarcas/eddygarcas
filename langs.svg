<circle cx="130" cy="130" r="82" fill="none"
      stroke="#00ADD8" stroke-width="40"
      stroke-dasharray="16.571607528822465 498.64958765990355" stroke-dashoffset="-470.65"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#3572A5" stroke-width="40"
      stroke-dasharray="12.233479867647116 502.9877153210789" stroke-dashoffset="-487.82"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#244776" stroke-width="40"
      stroke-dasharray="6.992019000383466 508.22917618834254" stroke-dashoffset="-500.65"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="6.376340328694638 508.8448548600314" stroke-dashoffset="-508.24"/>
  </g>
  <g>
