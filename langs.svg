<circle cx="130" cy="130" r="82" fill="none"
      stroke="#3572A5" stroke-width="40"
      stroke-dasharray="11.33690000785183 503.8842951808742" stroke-dashoffset="-489.73"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#244776" stroke-width="40"
      stroke-dasharray="6.461621056791651 508.75957413193436" stroke-dashoffset="-501.67"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="5.888955278163366 509.33223991056263" stroke-dashoffset="-508.73"/>
  </g>
  <g>
