<circle cx="130" cy="130" r="82" fill="none"
      stroke="#00ADD8" stroke-width="40"
      stroke-dasharray="23.331033975425193 491.8901612133008" stroke-dashoffset="-461.54"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#244776" stroke-width="40"
      stroke-dasharray="9.980539086704207 505.24065610202183" stroke-dashoffset="-485.47"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#3572A5" stroke-width="40"
      stroke-dasharray="9.13427486402635 506.0869203246997" stroke-dashoffset="-496.05"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="8.83508103175276 506.3861141569733" stroke-dashoffset="-505.79"/>
  </g>
  <g>
