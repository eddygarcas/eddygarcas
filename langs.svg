<circle cx="130" cy="130" r="82" fill="none"
      stroke="#3572A5" stroke-width="40"
      stroke-dasharray="11.93567426922792 503.2855209194981" stroke-dashoffset="-488.46"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#244776" stroke-width="40"
      stroke-dasharray="6.815843420187256 508.40535176853876" stroke-dashoffset="-500.99"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="6.214451797463102 509.00674339126294" stroke-dashoffset="-508.41"/>
  </g>
  <g>
