<circle cx="130" cy="130" r="82" fill="none"
      stroke="#3572A5" stroke-width="40"
      stroke-dasharray="11.2608529251059 503.96034226362013" stroke-dashoffset="-489.90"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#244776" stroke-width="40"
      stroke-dasharray="6.416633188880133 508.8045619998459" stroke-dashoffset="-501.76"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="5.847615724456077 509.37357946426994" stroke-dashoffset="-508.77"/>
  </g>
  <g>
