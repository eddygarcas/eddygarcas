<circle cx="130" cy="130" r="82" fill="none"
      stroke="#244776" stroke-width="40"
      stroke-dasharray="10.186933190679659 505.03426199804636" stroke-dashoffset="-487.06"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="9.019130736548188 506.20206445217786" stroke-dashoffset="-497.85"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#41b883" stroke-width="40"
      stroke-dasharray="7.1529507358646045 508.06824445286145" stroke-dashoffset="-507.47"/>
  </g>
  <g>
