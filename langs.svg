<circle cx="130" cy="130" r="82" fill="none"
      stroke="#3572A5" stroke-width="40"
      stroke-dasharray="13.610171689515147 501.6110234992109" stroke-dashoffset="-482.24"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#244776" stroke-width="40"
      stroke-dasharray="9.183927742048027 506.037267446678" stroke-dashoffset="-496.45"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="8.390495107617141 506.8307000811089" stroke-dashoffset="-506.23"/>
  </g>
  <g>
