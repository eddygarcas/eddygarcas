<circle cx="130" cy="130" r="82" fill="none"
      stroke="#00ADD8" stroke-width="40"
      stroke-dasharray="15.260042665793312 499.9611525229327" stroke-dashoffset="-474.05"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#3572A5" stroke-width="40"
      stroke-dasharray="11.253260558735843 503.96793462999017" stroke-dashoffset="-489.91"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#244776" stroke-width="40"
      stroke-dasharray="6.41214170330227 508.80905348542376" stroke-dashoffset="-501.77"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="5.843488478203002 509.377706710523" stroke-dashoffset="-508.78"/>
  </g>
  <g>
