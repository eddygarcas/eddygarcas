<circle cx="130" cy="130" r="82" fill="none"
      stroke="#3572A5" stroke-width="40"
      stroke-dasharray="11.307716839198658 503.9134783495274" stroke-dashoffset="-489.80"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#244776" stroke-width="40"
      stroke-dasharray="6.44435690293851 508.7768382857875" stroke-dashoffset="-501.70"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#000080" stroke-width="40"
      stroke-dasharray="5.8730911697146935 509.3481040190113" stroke-dashoffset="-508.75"/>
  </g>
  <g>
