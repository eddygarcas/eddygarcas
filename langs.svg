<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-label="Most used languages">
  <style>
    :root { --text:#1f2328; --muted:#59636e; --stroke:#d1d9e0; }
    @media (prefers-color-scheme: dark) {
      :root { --text:#e6edf3; --muted:#8b949e; --stroke:#30363d; }
    }
    .title { font: 600 16px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: var(--text); }
    .name  { font: 400 14px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: var(--text); }
    .pct   { font: 400 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: var(--muted); }
    .ring-bg { stroke: var(--stroke); }
  </style>
  <text x="130" y="26" text-anchor="middle" class="title">Most Used Languages</text>
  <g transform="rotate(-90 130 130)">
    <circle class="ring-bg" cx="130" cy="130" r="82" fill="none" stroke-width="40"/>
    <circle cx="130" cy="130" r="82" fill="none"
      stroke="#ec915c" stroke-width="40"
      stroke-dasharray="251.46289422800376 263.7583009607223" stroke-dashoffset="0.00"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#701516" stroke-width="40"
      stroke-dasharray="121.25211204248657 393.9690831462394" stroke-dashoffset="-252.06"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#f1e05a" stroke-width="40"
      stroke-dasharray="68.21965899616457 447.00153619256145" stroke-dashoffset="-373.92"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#00ADD8" stroke-width="40"
