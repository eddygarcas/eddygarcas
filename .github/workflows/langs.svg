      <text x="272" y="190" class="name">Python</text>
      <text x="460" y="190" class="pct" text-anchor="end">3.4%</text>
    </g>
<g>
      <rect x="250" y="205" width="13" height="13" rx="3" fill="#89e051"/>
      <text x="272" y="216" class="name">Shell</text>
