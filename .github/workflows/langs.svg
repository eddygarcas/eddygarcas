<svg xmlns="http://www.w3.org/2000/svg" width="480" height="260" viewBox="0 0 480 260" role="img" aria-label="Most used languages">
  <style>
    :root { --text:#1f2328; --muted:#59636e; --stroke:#d1d9e0; }
    @media (prefers-color-scheme: dark) {
      :root { --text:#e6edf3; --muted:#8b949e; --stroke:#30363d; }
    }
    .title { font: 600 16px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: var(--text); }
    .name  { font: 400 14px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: var(--text); }
    .pct   { font: 400 13px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: var(--muted); }
    .ring-bg { stroke: var(--stroke); }
  </style>
  <text x="130" y="26" text-anchor="middle" class="title">Most Used Languages</text>
  <g transform="rotate(-90 130 130)">
    <circle class="ring-bg" cx="130" cy="130" r="82" fill="none" stroke-width="40"/>
    <circle cx="130" cy="130" r="82" fill="none"
      stroke="#701516" stroke-width="40"
      stroke-dasharray="175.60564875454432 339.61554643418174" stroke-dashoffset="0.00"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#3178c6" stroke-width="40"
      stroke-dasharray="116.3552113078408 398.8659838808852" stroke-dashoffset="-176.21"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#00ADD8" stroke-width="40"
      stroke-dasharray="77.19840047349763 438.02279471522843" stroke-dashoffset="-293.16"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#ec915c" stroke-width="40"
      stroke-dasharray="49.891677128495154 465.3295180602309" stroke-dashoffset="-370.96"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#dea584" stroke-width="40"
      stroke-dasharray="37.01114724877699 478.21004793994905" stroke-dashoffset="-421.45"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#f1e05a" stroke-width="40"
      stroke-dasharray="25.161059759436302 490.06013542928974" stroke-dashoffset="-459.06"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#3572A5" stroke-width="40"
      stroke-dasharray="16.917520636416686 498.30367455230936" stroke-dashoffset="-484.82"/>
<circle cx="130" cy="130" r="82" fill="none"
      stroke="#89e051" stroke-width="40"
      stroke-dasharray="12.280529879718152 502.9406653090079" stroke-dashoffset="-502.34"/>
  </g>
  <g>
      <rect x="250" y="23" width="13" height="13" rx="3" fill="#701516"/>
      <text x="272" y="34" class="name">Ruby</text>
      <text x="460" y="34" class="pct" text-anchor="end">34.2%</text>
    </g>
<g>
