name: Update language donut

on:
  schedule:
    - cron: "0 6 * * *"      # daily at 06:00 UTC
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "generate-langs.js"
      - ".github/workflows/langs.yml"

permissions:
  contents: write

jobs:
  donut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate langs.svg
        env:
          GH_USER: eddygarcas
          # Uses a PAT if you add one (needed for PRIVATE repos), else the
          # built-in token (public repos only) — same scope as most stat cards.
          GH_TOKEN: ${{ secrets.LANGS_TOKEN || secrets.GITHUB_TOKEN }}
          IGNORE: "css,scss,html,shell,c,c++"
          TOP: "8"
          OUT: "langs.svg"
        run: node generate-langs.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add langs.svg
          if git diff --cached --quiet; then
            echo "No change in langs.svg"
          else
            git commit -m "chore: refresh language donut"
            git push
          fi
